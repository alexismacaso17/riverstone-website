<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Riverstone Group</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Internal lobby / welcome display. Deliberately unlisted and not indexed —
     reachable only by typing the URL. Open full-screen on the entrance screen. -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Welcome to The Riverstone Group.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="colors_and_type.css?v=6">
<link rel="icon" href="assets/favicon.png">
<style>
  /* ============================================================
     LOBBY / WELCOME DISPLAY — ambient, full-screen, looping.
     River video backdrop; headline → mission → values cross-fade.
     Self-contained; no nav, no scroll, nothing to click.
     ============================================================ */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--rs-charcoal); overflow: hidden; }
  body { cursor: none; }   /* kiosk: hide the pointer on the display */

  .lobby { position: fixed; inset: 0; overflow: hidden;
    --accent: #d6805a;                        /* ONE standardized terracotta (on dark) */
    --ink: 0 2px 30px rgba(0,0,0,0.46);       /* ONE legibility shadow for cream type */
    --glow: 0 2px 30px rgba(196,96,54,0.45);  /* ONE subtle warm glow for the accent */
  }

  /* ---- River video: two stacked layers cross-dissolve at the loop point ---- */
  .lobby__video { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0;
    object-fit: cover; object-position: 50% 60%; background: #231a10;
    /* one consistent warm print grade across every segment */
    filter: brightness(0.9) contrast(1.07) saturate(1.06) sepia(0.15) hue-rotate(-7deg);
    opacity: 1; transition: opacity 1.2s linear; will-change: opacity; }
  .lobby__video--b { opacity: 0; }

  /* ---- Scrim: a soft central "pool" lifts the type off the moving water while
     the foliage, stone and highlights keep their richness toward the edges. ---- */
  .lobby__scrim { position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(72% 62% at 50% 47%, rgba(12,8,5,0.52) 0%, rgba(12,8,5,0.26) 45%, rgba(12,8,5,0) 76%),
      linear-gradient(180deg, rgba(12,8,5,0.32) 0%, rgba(12,8,5,0) 24%, rgba(12,8,5,0) 68%, rgba(12,8,5,0.44) 100%); }

  /* ---- Brand mark, top-center. Persistent on every segment. ---- */
  .lobby__brand { position: absolute; top: clamp(30px, 5.5vh, 76px); left: 50%; transform: translateX(-50%);
    z-index: 4; width: clamp(210px, 19vw, 340px); height: auto;
    filter: drop-shadow(0 2px 20px rgba(0,0,0,0.6)); }

  /* ---- Cross-fading stage. One easing, one duration, opacity + a whisper of
     rise (no scale/zoom) — a continuous cinematic composition. ---- */
  .lobby__stage { position: absolute; inset: 0; z-index: 2; }
  .lobby__panel { position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    /* optically centred: content rests a touch above true centre, balancing the top mark */
    padding: clamp(96px, 15vh, 210px) clamp(40px, 8vw, 150px) clamp(130px, 19vh, 250px);
    color: var(--rs-cream);
    opacity: 0; transform: translateY(10px);
    transition: opacity 1.4s var(--ease-editorial), transform 1.4s var(--ease-editorial);
    will-change: opacity, transform; }
  .lobby__panel.is-active { opacity: 1; transform: none; }
  /* Mission sits a little higher over the greenery. */
  .lobby__panel--up { padding-top: clamp(110px, 15vh, 190px); padding-bottom: clamp(150px, 21vh, 290px); }

  /* ---- Shared accent: one terracotta for every italic emphasis, with a slow,
     almost-subliminal warm "breathing" glow to quietly draw the eye. ---- */
  .lobby__title em, .lobby__mission em { font-style: italic; color: var(--accent);
    text-shadow: 0 2px 28px rgba(0,0,0,0.42), var(--glow);
    animation: accent-breathe 5.5s ease-in-out infinite; }
  @keyframes accent-breathe {
    0%, 100% { text-shadow: 0 2px 28px rgba(0,0,0,0.42), 0 2px 22px rgba(196,96,54,0.30); }
    50%      { text-shadow: 0 2px 28px rgba(0,0,0,0.42), 0 2px 44px rgba(216,114,64,0.62); }
  }

  /* ---- 2 · "Shaped over time" — solid serif italic; letters materialise in
     (fade + rise + blur-to-sharp), left to right, replaying every loop. ---- */
  .lobby__eyebrow { font-family: var(--font-display); font-style: italic; font-weight: 500;
    font-size: clamp(22px, 2.4vw, 38px); letter-spacing: 0.01em; color: var(--rs-cream);
    margin: 0 0 clamp(34px, 5vh, 68px); text-shadow: var(--ink); white-space: nowrap; }
  .lobby__eyebrow span { display: inline-block; }
  .lobby__eyebrow span.sp { width: 0.32em; }
  .lobby__eyebrow span:not(.sp) { opacity: 1; }            /* resting / reduced-motion / fade-out */
  .lobby__eyebrow.reveal span:not(.sp) {
    animation: ey-in 0.62s var(--ease-editorial) both;
    animation-delay: calc(var(--i) * 0.075s + 0.12s); }
  @keyframes ey-in {
    from { opacity: 0; transform: translateY(0.3em); filter: blur(5px); }
    to   { opacity: 1; transform: none;             filter: blur(0); }
  }

  /* ---- 1 · Headline ---- */
  .lobby__title { font-family: var(--font-sans); font-weight: 500; text-transform: uppercase;
    font-size: clamp(56px, 8.8vw, 150px); line-height: 1.04; letter-spacing: -0.012em;
    color: var(--rs-cream); margin: 0; text-shadow: var(--ink); }
  .lobby__title em { font-family: var(--font-display); text-transform: lowercase;
    font-weight: 500; font-size: 1.0em; letter-spacing: -0.005em; margin-right: 0.08em; }
  .lobby__title .v { font-size: 0.88em; }                  /* "value" a touch smaller for balance */
  .lobby__title .l1, .lobby__title .l2 { display: block; }

  /* ---- 2 · Mission (−~13%, more air) ---- */
  .lobby__mission { font-family: var(--font-display); font-weight: 400;
    font-size: clamp(40px, 5.7vw, 104px); line-height: 1.14; letter-spacing: -0.012em;
    color: var(--rs-cream); margin: 0; max-width: 19ch; text-wrap: balance; text-shadow: var(--ink); }

  /* ---- 3 · Core values — immersive editorial installation ----
     The seven values are art-directed across the full canvas as an oversized
     typographic composition: three tiers of scale, a confident nature palette,
     serif italics played against tracked sans caps. Excellence anchors the
     centre; the others orbit it with intentional, unequal spacing. Motion is
     layered so nothing competes for `transform` — the li carries centring +
     cursor parallax + hover, .w carries the staggered entrance, .f carries a
     continuous ambient drift. Generous negative space keeps the river alive. */
  .lobby__values { list-style: none; margin: 0; padding: 0;
    position: absolute; inset: 0; z-index: 2; }
  .lobby__values li { position: absolute; margin: 0; line-height: 0.96;
    white-space: nowrap; font-family: var(--font-display); font-weight: 400;
    --px: 0px; --py: 0px;
    transform: translate(calc(-50% + var(--px)), calc(-50% + var(--py)));
    transition: transform 0.5s cubic-bezier(0.22,0.61,0.36,1);
    /* Dense dark halo hugging each glyph keeps the colour bold and legible over
       any video frame (bright foam included), topped by the word's own glow. */
    text-shadow:
      0 1px 2px rgba(0,0,0,0.80), 0 2px 12px rgba(0,0,0,0.70),
      0 4px 34px rgba(0,0,0,0.62), 0 0 24px rgba(0,0,0,0.52),
      0 0 50px var(--g, transparent); }
  .lobby__values .w { display: inline-block; }
  .lobby__values .f { display: inline-block; will-change: transform;
    animation: val-float var(--fd, 8s) ease-in-out infinite; }

  /* tier · colour · glow · scale · anchor (left/top) · parallax depth · drift */
  .lobby__values li:nth-child(1) {                      /* Grateful — hero */
    font-style: italic; color: #F0E3CC; --g: rgba(240,227,204,0.22);
    font-size: clamp(50px, min(7vw, 12.4vh), 140px);
    left: 20%; top: 28.5%; --depth: 8px; --fa: 6px; --fd: 8.2s; }
  .lobby__values li:nth-child(2) {                      /* Purposeful — secondary */
    color: #C47756; --g: rgba(196,119,86,0.26);
    font-size: clamp(34px, min(4.4vw, 7.8vh), 82px);
    left: 78%; top: 31%; --depth: 5px; --fa: 4.5px; --fd: 7.6s; }
  .lobby__values li:nth-child(3) {                      /* Trustworthy — accent */
    font-family: var(--font-sans); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.24em; color: #C3CEB5; --g: rgba(195,206,181,0.24);
    font-size: clamp(19px, min(2.55vw, 4.3vh), 44px);
    left: 18%; top: 66%; --depth: 3px; --fa: 3px; --fd: 7.2s; }
  .lobby__values li:nth-child(4) {                      /* Excellence — anchor */
    font-style: italic; color: #D9B66F; --g: rgba(217,182,111,0.26);
    font-size: clamp(64px, min(9vw, 16vh), 172px);
    left: 41%; top: 50%; --depth: 8px; --fa: 6px; --fd: 9s; }
  .lobby__values li:nth-child(5) {                      /* Innovative — secondary */
    font-style: italic; color: #91B5C4; --g: rgba(145,181,196,0.24);
    font-size: clamp(34px, min(4.4vw, 7.8vh), 82px);
    left: 81.5%; top: 62%; --depth: 5px; --fa: 4.5px; --fd: 8.8s; }
  .lobby__values li:nth-child(6) {                      /* Collaborative — accent */
    font-family: var(--font-sans); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.24em; color: #B4A1BD; --g: rgba(180,161,189,0.24);
    font-size: clamp(20px, min(2.7vw, 4.5vh), 46px);
    left: 26%; top: 80%; --depth: 3px; --fa: 3px; --fd: 9.2s; }
  .lobby__values li:nth-child(7) {                      /* Generous — hero */
    font-style: italic; color: #D58D78; --g: rgba(213,141,120,0.24);
    font-size: clamp(50px, min(7vw, 12.4vh), 140px);
    left: 61%; top: 76%; --depth: 8px; --fa: 6px; --fd: 9.6s; }

  /* Entrance — each value materialises out of thin air, one at a time, so every
     word earns its own beat of emphasis. It fades up from a soft, slightly
     smaller, blurred state into a sharp, full-size word; generous spacing
     between words makes the reveal feel deliberate (Grateful leads, then
     Excellence anchors, then outward). Replays each time the segment appears. */
  .lobby__values.reveal .w { animation: val-in 1.15s var(--ease-editorial) backwards; }
  .lobby__values.reveal li:nth-child(1) .w { animation-delay: .10s; }   /* Grateful */
  .lobby__values.reveal li:nth-child(4) .w { animation-delay: .72s; }   /* Excellence */
  .lobby__values.reveal li:nth-child(7) .w { animation-delay: 1.34s; }  /* Generous */
  .lobby__values.reveal li:nth-child(2) .w { animation-delay: 1.96s; }  /* Purposeful */
  .lobby__values.reveal li:nth-child(5) .w { animation-delay: 2.58s; }  /* Innovative */
  .lobby__values.reveal li:nth-child(3) .w { animation-delay: 3.20s; }  /* Trustworthy */
  .lobby__values.reveal li:nth-child(6) .w { animation-delay: 3.82s; }  /* Collaborative */
  @keyframes val-in {
    0%   { opacity: 0; transform: scale(0.88); filter: blur(12px) brightness(1.5); }
    45%  { opacity: 1;                         filter: blur(3px)  brightness(1.3); }
    100% { opacity: 1; transform: none;        filter: blur(0)    brightness(1); }
  }

  /* continuous ambient drift — amplitude + period per word, set above */
  @keyframes val-float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(calc(var(--fa, 4px) * -1)); }
  }

  /* ---- Reduced motion ---- */
  @media (prefers-reduced-motion: reduce) {
    .lobby__panel { transition: opacity 0.6s linear; transform: none; }
    .lobby__eyebrow.reveal span:not(.sp) { animation: none; opacity: 1; }
    .lobby__title em, .lobby__mission em { animation: none; }
    .lobby__values.reveal .w { animation: none; opacity: 1; transform: none; filter: none; }
    .lobby__values .f { animation: none; transform: none; }
    .lobby__video { transition: opacity 0.4s linear; }
  }

  /* ---- Responsive: phones / small tablets — recompose, don't just shrink ---- */
  @media (max-width: 820px) {
    .lobby__panel { padding: clamp(78px,12vh,150px) clamp(22px,7vw,64px) clamp(96px,16vh,180px); }
    .lobby__panel--up { padding-top: clamp(60px,9vh,120px); padding-bottom: clamp(130px,21vh,250px); }
    .lobby__brand { width: clamp(168px, 44vw, 250px); top: clamp(20px,3.6vh,46px); }
    .lobby__eyebrow { font-size: clamp(18px, 4.6vw, 28px); margin-bottom: clamp(22px,3.4vh,42px); white-space: normal; }
    .lobby__title { font-size: clamp(46px, 13.2vw, 104px); letter-spacing: -0.01em; }
    .lobby__mission { font-size: clamp(33px, 8.6vw, 76px); max-width: 15ch; }
    /* Values — a separately composed stack (not the desktop canvas shrunk):
       one column with deliberate left/right shifts for rhythm, full colour +
       tier hierarchy preserved, no overlap, clipping or horizontal scroll. */
    .lobby__values { position: static; inset: auto; z-index: auto;
      display: flex; flex-direction: column; justify-content: center;
      align-items: stretch; width: min(92vw, 560px); height: 100%;
      margin: 0 auto; padding-top: clamp(96px, 15vh, 150px); }
    .lobby__values li { position: static; left: auto; top: auto;
      transform: none; margin: clamp(1px,0.5vh,7px) 0; display: block; line-height: 1.02; }
    .lobby__values li:nth-child(1) { font-size: clamp(42px,12vw,66px);  text-align: left;   padding-left: 3vw; }   /* Grateful */
    .lobby__values li:nth-child(2) { font-size: clamp(27px,7.4vw,42px); text-align: right;  padding-right: 5vw; }  /* Purposeful */
    .lobby__values li:nth-child(3) { font-size: clamp(17px,5vw,26px);   text-align: left;   padding-left: 10vw; }  /* Trustworthy */
    .lobby__values li:nth-child(4) { font-size: clamp(46px,13.4vw,78px);text-align: center; }                      /* Excellence */
    .lobby__values li:nth-child(5) { font-size: clamp(27px,7.4vw,42px); text-align: right;  padding-right: 3vw; }  /* Innovative */
    .lobby__values li:nth-child(6) { font-size: clamp(17px,5vw,26px);   text-align: left;   padding-left: 5vw; }   /* Collaborative */
    .lobby__values li:nth-child(7) { font-size: clamp(42px,12vw,66px);  text-align: right;  padding-right: 8vw; }  /* Generous */
  }
</style>
</head>
<body>
<main class="lobby" aria-label="Welcome to The Riverstone Group">

  <video class="lobby__video" data-vid="a" autoplay muted playsinline preload="auto" aria-hidden="true">
    <source src="assets/hero.mp4?v=2#t=1.4" type="video/mp4">
  </video>
  <video class="lobby__video lobby__video--b" data-vid="b" muted playsinline preload="auto" aria-hidden="true">
    <source src="assets/hero.mp4?v=2#t=1.4" type="video/mp4">
  </video>
  <div class="lobby__scrim" aria-hidden="true"></div>

  <img class="lobby__brand" src="assets/logo-reverse-wordmark.png" alt="The Riverstone Group">

  <div class="lobby__stage">

    <!-- 1 · Headline -->
    <section class="lobby__panel is-active" aria-label="Creating enduring value">
      <h1 class="lobby__title">
        <span class="l1">Creating</span>
        <span class="l2"><em>enduring</em> <span class="v">value</span></span>
      </h1>
    </section>

    <!-- 2 · Mission (lifted up so it reads over the greenery, off the rock) -->
    <section class="lobby__panel lobby__panel--up" aria-label="Our mission">
      <p class="lobby__eyebrow" aria-label="Shaped over time"><span style="--i:0">S</span><span style="--i:1">h</span><span style="--i:2">a</span><span style="--i:3">p</span><span style="--i:4">e</span><span style="--i:5">d</span><span class="sp">&nbsp;</span><span style="--i:6">o</span><span style="--i:7">v</span><span style="--i:8">e</span><span style="--i:9">r</span><span class="sp">&nbsp;</span><span style="--i:10">t</span><span style="--i:11">i</span><span style="--i:12">m</span><span style="--i:13">e</span></p>
      <p class="lobby__mission">Places where businesses, communities, and individuals <em>thrive.</em></p>
    </section>

    <!-- 3 · Invitation — placed before Values so "enduring" (headline) and
         "endures" (here) never land back-to-back across the loop seam. -->
    <section class="lobby__panel" aria-label="Let's build something that endures">
      <p class="lobby__mission">Let&rsquo;s build something that <em>endures.</em></p>
    </section>

    <!-- 4 · Values — art-directed across the canvas (positions/scale in CSS).
         Each word: .w carries the entrance, .f the continuous ambient drift. -->
    <section class="lobby__panel" aria-label="What guides us">
      <ul class="lobby__values">
        <li><span class="w"><span class="f">Grateful</span></span></li>
        <li><span class="w"><span class="f">Purposeful</span></span></li>
        <li><span class="w"><span class="f">Trustworthy</span></span></li>
        <li><span class="w"><span class="f">Excellence</span></span></li>
        <li><span class="w"><span class="f">Innovative</span></span></li>
        <li><span class="w"><span class="f">Collaborative</span></span></li>
        <li><span class="w"><span class="f">Generous</span></span></li>
      </ul>
    </section>

  </div>
</main>

<script>
(function () {
  "use strict";

  /* River video — crossfade loop.
     hero.mp4 is a single ~15s one-directional pan, so it can't loop seamlessly.
     Two stacked layers play the same clip; ~1.2s before the active layer reaches
     the end, the other starts from the in-point and we cross-dissolve, hiding the
     pan's hard reset. The idle layer stays paused except during the dissolve. */
  var IN = 1.4;         /* skip the brief opening angle */
  var XF = 1.2;         /* crossfade seconds — matches the CSS opacity transition */
  var vids = [].slice.call(document.querySelectorAll(".lobby__video"));
  if (vids.length >= 2) {
    var active = 0, transitioning = false;
    var seekIn = function (el) { try { el.currentTime = IN; } catch (e) {} };
    vids.forEach(function (el) {
      el.addEventListener("loadedmetadata", function () { seekIn(el); });
      if (el.readyState >= 1) seekIn(el);
      el.addEventListener("timeupdate", function () {
        if (transitioning || el !== vids[active]) return;
        if (el.duration && el.currentTime >= el.duration - XF) crossfade();
      });
    });
    function crossfade() {
      transitioning = true;
      var cur = vids[active], nxt = vids[1 - active];
      seekIn(nxt);
      var p = nxt.play(); if (p && p.catch) p.catch(function () {});
      nxt.style.opacity = "1";
      cur.style.opacity = "0";
      setTimeout(function () {
        cur.pause(); seekIn(cur);
        active = 1 - active;
        transitioning = false;
      }, XF * 1000 + 80);
    }
    /* Fade the first frame up from black once it is genuinely playing, so the
       initial load + seek-to-in-point never shows as a hard pop. */
    vids[0].style.opacity = "0";
    var faded0 = false;
    function fadeInFirst() { if (faded0) return; faded0 = true; vids[0].style.opacity = "1"; }
    vids[0].addEventListener("playing", fadeInFirst);
    vids[0].addEventListener("timeupdate", function tu() {
      if (vids[0].currentTime > IN + 0.05) { fadeInFirst(); vids[0].removeEventListener("timeupdate", tu); }
    });
    var pr = vids[0].play(); if (pr && pr.catch) pr.catch(function () {});

    /* Watchdog — keep the river moving for hours. Resume the active layer if it
       ever pauses unexpectedly, and if its playhead stalls (no progress for a
       few seconds), reload and replay from the in-point. */
    var wActive = -1, wTime = 0, wSince = Date.now();
    setInterval(function () {
      var v = vids[active];
      if (active !== wActive) { wActive = active; wTime = v.currentTime; wSince = Date.now(); }
      if (!transitioning && v.paused && !v.ended) { var q = v.play(); if (q && q.catch) q.catch(function () {}); }
      if (!v.paused) {
        if (v.currentTime > wTime + 0.02) { wTime = v.currentTime; wSince = Date.now(); }
        else if (Date.now() - wSince > 6000) {
          try { v.load(); seekIn(v); } catch (e) {}
          var r = v.play(); if (r && r.catch) r.catch(function () {});
          wSince = Date.now();
        }
      }
    }, 2000);
    vids.forEach(function (el) {
      el.addEventListener("error", function () {
        try { el.load(); seekIn(el); } catch (e) {}
        if (el === vids[active]) { var p2 = el.play(); if (p2 && p2.catch) p2.catch(function () {}); }
      });
    });
  }

  /* Cross-fade the panels forever. The dense values composition holds longer so
     it stays bold and readable well past its staggered entrance. */
  var panels = [].slice.call(document.querySelectorAll(".lobby__panel"));
  var HOLD_MS = 6000, HOLD_VALUES = 9500;
  function holdFor(panel) { return panel.querySelector(".lobby__values") ? HOLD_VALUES : HOLD_MS; }

  /* Replay the per-segment reveals (eyebrow letters, values composition) each
     time a segment appears. */
  function restart(el) { if (el) { el.classList.remove("reveal"); void el.offsetWidth; el.classList.add("reveal"); } }
  function animateIn(panel) {
    restart(panel.querySelector(".lobby__eyebrow"));
    restart(panel.querySelector(".lobby__values"));
  }

  if (panels.length > 1) {
    var i = 0;
    animateIn(panels[0]);
    (function schedule() {
      setTimeout(function () {
        panels[i].classList.remove("is-active");
        i = (i + 1) % panels.length;
        panels[i].classList.add("is-active");
        animateIn(panels[i]);
        schedule();
      }, holdFor(panels[i]));
    })();
  }

  /* Very restrained cursor parallax on the values — each word shifts by its own
     depth (hero 8px → accent 3px) for a layered, integrated feel. Pointer-only
     and off under reduced-motion; the kiosk has no mouse, so it simply rests. */
  var fine = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (fine && !calm) {
    var vlis = [].slice.call(document.querySelectorAll(".lobby__values li")).map(function (el) {
      return { el: el, d: parseFloat(getComputedStyle(el).getPropertyValue("--depth")) || 4 };
    });
    var nx = 0, ny = 0, raf = 0;
    function apply() {
      raf = 0;
      vlis.forEach(function (o) {
        o.el.style.setProperty("--px", (nx * o.d).toFixed(1) + "px");
        o.el.style.setProperty("--py", (ny * o.d).toFixed(1) + "px");
      });
    }
    window.addEventListener("pointermove", function (e) {
      nx = (e.clientX / window.innerWidth  - 0.5) * 2;   /* -1 … 1 */
      ny = (e.clientY / window.innerHeight - 0.5) * 2;
      if (!raf) raf = requestAnimationFrame(apply);
    }, { passive: true });
  }

  /* Screen Wake Lock — keep the lobby display from sleeping during long runs;
     re-acquire it whenever the page becomes visible again (the lock is dropped
     automatically when the tab is hidden or the device sleeps). */
  var wakeLock = null;
  function requestWakeLock() {
    if (!("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(function (lock) {
      wakeLock = lock; lock.addEventListener("release", function () { wakeLock = null; });
    }).catch(function () {});
  }
  requestWakeLock();
  function resumeVideo() { if (vids.length >= 2) { var p = vids[active].play(); if (p && p.catch) p.catch(function () {}); } }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { requestWakeLock(); resumeVideo(); }
  });
  window.addEventListener("pageshow", resumeVideo);
  window.addEventListener("focus", resumeVideo);
})();
</script>
</body>
