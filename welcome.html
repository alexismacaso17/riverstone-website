<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Riverstone Group</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Internal lobby / welcome display. Deliberately unlisted and not indexed —
     reachable only by typing the URL. Open full-screen on the entrance screen. -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Welcome to The Riverstone Group.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="colors_and_type.css?v=6">
<link rel="icon" href="assets/favicon.png">
<style>
  /* ============================================================
     LOBBY / WELCOME DISPLAY — ambient, full-screen, looping.
     River video backdrop; headline → mission → values cross-fade.
     Self-contained; no nav, no scroll, nothing to click.
     ============================================================ */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--rs-charcoal); overflow: hidden; }
  body { cursor: none; }   /* kiosk: hide the pointer on the display */

  .lobby { position: fixed; inset: 0; overflow: hidden; }

  /* ---- River video, full-bleed. Two stacked layers cross-dissolve at the loop
     point so the one-directional pan never hard-cuts back to the start. ---- */
  .lobby__video { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0;
    object-fit: cover; object-position: 50% 62%; background: #231a10;
    /* warm print grade to match the site's hero treatment */
    filter: brightness(0.92) contrast(1.07) saturate(1.07) sepia(0.16) hue-rotate(-7deg);
    opacity: 1; transition: opacity 1.2s linear; will-change: opacity; }
  .lobby__video--b { opacity: 0; }
  /* Legibility scrim — warm, soft vignette + top & bottom darkening */
  .lobby__scrim { position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(130% 100% at 50% 48%, rgba(16,11,6,0) 34%, rgba(16,11,6,0.5) 100%),
      linear-gradient(180deg, rgba(16,11,6,0.5) 0%, rgba(16,11,6,0.2) 26%, rgba(16,11,6,0.22) 68%, rgba(16,11,6,0.56) 100%); }

  /* ---- Persistent brand mark, top-center ---- */
  .lobby__brand { position: absolute; top: clamp(34px, 6vh, 80px); left: 50%; transform: translateX(-50%); z-index: 4;
    width: clamp(220px, 20vw, 360px); height: auto; filter: drop-shadow(0 2px 20px rgba(0,0,0,0.6)); }

  /* ---- Cross-fading stage ---- */
  .lobby__stage { position: absolute; inset: 0; z-index: 2; }
  .lobby__panel { position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: clamp(140px, 20vh, 240px) clamp(32px, 8vw, 150px) clamp(60px, 10vh, 130px);
    color: var(--rs-cream);
    opacity: 0; transform: translateY(16px) scale(0.994);
    transition: opacity 1.5s var(--ease-editorial), transform 1.5s var(--ease-editorial);
    will-change: opacity, transform; }
  .lobby__panel.is-active { opacity: 1; transform: none; }

  /* 2 · "Shaped over time" — drawn-in handwriting reveal (real serif letterforms as SVG) */
  .lobby__eyebrow { margin: 0 0 clamp(30px, 4.6vh, 60px); line-height: 0; }
  .hw { display: block; height: clamp(30px, 3.5vw, 54px); width: auto; overflow: visible;
    filter: drop-shadow(0 2px 20px rgba(0,0,0,0.5)); }
  /* Resting state = the finished, filled letters (also the reduced-motion state). */
  .hw path { fill: var(--rs-cream); fill-opacity: 1;
    stroke: var(--rs-cream); stroke-width: 1.15px; vector-effect: non-scaling-stroke;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 100; stroke-dashoffset: 0; stroke-opacity: 0; }
  /* The draw plays each time the segment (re)appears; JS toggles .draw after a reflow. */
  .hw.draw path { animation: hw-draw 1.05s var(--ease-editorial) both;
    animation-delay: calc(var(--i) * 0.155s + 0.12s); }
  @keyframes hw-draw {
    0%   { stroke-dashoffset: 100; fill-opacity: 0; stroke-opacity: 0.85; }
    45%  { stroke-dashoffset: 0;   fill-opacity: 0; stroke-opacity: 0.85; }
    72%  { fill-opacity: 1; stroke-opacity: 0.35; }
    100% { stroke-dashoffset: 0; fill-opacity: 1; stroke-opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .hw.draw path { animation: none; } }

  /* 1 · Headline — the site's signature statement */
  .lobby__title { font-family: var(--font-sans); font-weight: 500; text-transform: uppercase;
    font-size: clamp(58px, 9.2vw, 158px); line-height: 1.0; letter-spacing: -0.01em;
    color: var(--rs-cream); margin: 0; text-shadow: 0 2px 34px rgba(0,0,0,0.42); }
  .lobby__title em { font-family: var(--font-display); font-style: italic; text-transform: lowercase;
    font-weight: 500; font-size: 1.0em; color: var(--emphasis-on-dark); margin-right: 0.12em; }
  .lobby__title .l1 { display: block; }
  .lobby__title .l2 { display: block; }

  /* 2 · Mission */
  .lobby__mission { font-family: var(--font-display); font-weight: 400;
    font-size: clamp(46px, 6.6vw, 120px); line-height: 1.1; letter-spacing: -0.01em;
    color: var(--rs-cream); margin: 0; max-width: 20ch; text-wrap: balance; text-shadow: 0 2px 34px rgba(0,0,0,0.42); }
  .lobby__mission em { font-style: italic; color: #d9825d;
    text-shadow: 0 2px 26px rgba(205,100,56,0.6), 0 2px 34px rgba(0,0,0,0.4); }

  /* 3 · Values */
  .lobby__values { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: clamp(8px, 1.4vh, 20px); }
  .lobby__values li { font-family: var(--font-display); font-weight: 400;
    font-size: clamp(30px, 3.8vw, 66px); line-height: 1.12; color: var(--rs-cream);
    text-shadow: 0 2px 30px rgba(0,0,0,0.4); }

  @media (prefers-reduced-motion: reduce) {
    .lobby__panel { transition: opacity 0.6s linear; transform: none; }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  /* River video — crossfade loop.
     hero.mp4 is a single ~15s one-directional pan, so it can't loop seamlessly.
     Two stacked layers play the same clip; ~1.2s before the active layer reaches
     the end, the other starts from the in-point and we cross-dissolve, hiding the
     pan's hard reset. The idle layer stays paused except during the dissolve. */
  var IN = 1.4;         /* skip the brief opening angle */
  var XF = 1.2;         /* crossfade seconds — matches the CSS opacity transition */
  var vids = [].slice.call(document.querySelectorAll(".lobby__video"));
  if (vids.length >= 2) {
    var active = 0, transitioning = false;
    var seekIn = function (el) { try { el.currentTime = IN; } catch (e) {} };
    vids.forEach(function (el) {
      el.addEventListener("loadedmetadata", function () { seekIn(el); });
      if (el.readyState >= 1) seekIn(el);
      el.addEventListener("timeupdate", function () {
        if (transitioning || el !== vids[active]) return;
        if (el.duration && el.currentTime >= el.duration - XF) crossfade();
      });
    });
    function crossfade() {
      transitioning = true;
      var cur = vids[active], nxt = vids[1 - active];
      seekIn(nxt);
      var p = nxt.play(); if (p && p.catch) p.catch(function () {});
      nxt.style.opacity = "1";
      cur.style.opacity = "0";
      setTimeout(function () {
        cur.pause(); seekIn(cur);
        active = 1 - active;
        transitioning = false;
      }, XF * 1000 + 80);
    }
    var pr = vids[0].play(); if (pr && pr.catch) pr.catch(function () {});
  }

  /* Cross-fade the panels forever. */
  var panels = [].slice.call(document.querySelectorAll(".lobby__panel"));
  var HOLD_MS = 6000;

  /* Replay the "Shaped over time" handwriting draw whenever its segment appears. */
  function drawHandwriting(panel) {
    var hw = panel.querySelector(".hw");
    if (hw) { hw.classList.remove("draw"); void hw.offsetWidth; hw.classList.add("draw"); }
  }

  if (panels.length > 1) {
    var i = 0;
    setInterval(function () {
      panels[i].classList.remove("is-active");
      i = (i + 1) % panels.length;
      panels[i].classList.add("is-active");
      drawHandwriting(panels[i]);
    }, HOLD_MS);
  }
})();
</script>
